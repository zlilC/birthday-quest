  const revealed = {};

  function checkCode() {
    const input = document.getElementById('codeInput');
    const code = input.value.trim().toLowerCase();
    const resultDiv = document.getElementById('result');
    const finalDiv = document.getElementById('finalMessage');

    if (codes[code] && !revealed[code]) {
      revealed[code] = true;
      const data = codes[code];

      let html = `<div><p><strong>Wish:</strong> ${data.text}</p>`;
      if (data.attachment) {
        html += `<p><strong>Attachment:</strong> <a href="${data.attachment}" target="_blank">${data.attachment}</a></p>`;
      }
      if (data.hint) {
        html += `<p><strong>Next Hint:</strong> ${data.hint}</p>`;
      }
      html += `</div>`;

      resultDiv.innerHTML = html;
      input.value = '';

      if (Object.keys(revealed).length === 45) {
        finalDiv.innerHTML = `<div style="font-size: 1.8em; margin-top: 2em;">🎉 ${finalSecretMessage} 🎉</div>`;
        showConfetti();
      }

    } else if (revealed[code]) {
      resultDiv.innerHTML = `<p style="color:orange;">⚠️ You already used that code!</p>`;
    } else {
      resultDiv.innerHTML = `<p style="color:red;">❌ Invalid code. Try again, Mamunki!</p>`;
    }
  }

  function showConfetti() {
    const confetti = document.createElement('div');
    confetti.style.position = 'fixed';
    confetti.style.top = '0';
    confetti.style.left = '0';
    confetti.style.width = '100vw';
    confetti.style.height = '100vh';
    confetti.style.pointerEvents = 'none';
    confetti.style.zIndex = '9999';
    confetti.style.fontSize = '2rem';
    confetti.innerHTML = '🎊'.repeat(300);
    document.body.appendChild(confetti);
  }
