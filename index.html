<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The 45 Quest – Mamunki Edition</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fef6e4;
      color: #001858;
      text-align: center;
      padding: 3em 1em;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 0.2em;
    }
    input {
      font-size: 1.2em;
      padding: 0.6em;
      border: 2px solid #001858;
      border-radius: 5px;
      width: 250px;
      margin-bottom: 1em;
      text-transform: lowercase;
    }
    button {
      font-size: 1.2em;
      padding: 0.6em 1em;
      background-color: #f582ae;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #result, #finalMessage {
      margin-top: 2em;
      font-size: 1.2em;
      padding: 1em;
    }
    #finalMessage {
      font-size: 1.8em;
      letter-spacing: 0.1em;
      word-wrap: break-word;
      max-width: 600px;
      margin: 2em auto;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🎉 Mamunki’s 45 Quest 🎉</h1>
  <p>Enter the code you found to unlock your next surprise:</p>

  <input id="codeInput" type="text" placeholder="Enter code (e.g. bday01)" />
  <br />
  <button onclick="checkCode()">Unlock</button>

  <div id="result"></div>
  <div id="finalMessage"></div>

  <script>
    const secretMessage = "IF LOST RETURN MAMUNKI TO ZLIL IMMEDIATELY!";
    const codes = {};
    const revealed = Array(secretMessage.length).fill('_');

    // Generate bday01–bday45 codes and map them to message characters
    for (let i = 0; i < 45; i++) {
      const code = `bday${String(i + 1).padStart(2, '0')}`;
      codes[code] = secretMessage[i];
    }

    function checkCode() {
      const input = document.getElementById('codeInput');
      const code = input.value.trim().toLowerCase();
      const resultDiv = document.getElementById('result');
      const finalDiv = document.getElementById('finalMessage');

      if (codes[code]) {
        const index = Object.keys(codes).indexOf(code);
        revealed[index] = codes[code];
        resultDiv.innerHTML = `<p>✅ Code accepted! You unlocked: <strong>${codes[code]}</strong></p>`;
        input.value = '';
        updateFinalMessage();
      } else {
        resultDiv.innerHTML = `<p style="color:red;">❌ Invalid code. Try again, Mamunki!</p>`;
      }
    }

    function updateFinalMessage() {
      document.getElementById('finalMessage').innerText = revealed.join('');
    }
  </script>

</body>
</html>
