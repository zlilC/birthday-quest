<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The 45 Quest – Mamunki Edition</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fef6e4;
      color: #001858;
      text-align: center;
      padding: 3em 1em;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 0.2em;
    }
    input {
      font-size: 1.2em;
      padding: 0.6em;
      border: 2px solid #001858;
      border-radius: 5px;
      width: 250px;
      margin-bottom: 1em;
      text-transform: lowercase;
    }
    button {
      font-size: 1.2em;
      padding: 0.6em 1em;
      background-color: #f582ae;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #result, #finalMessage {
      margin-top: 2em;
      font-size: 1.2em;
      padding: 1em;
    }
    #finalMessage {
      font-size: 1.8em;
      letter-spacing: 0.1em;
      word-wrap: break-word;
      max-width: 600px;
      margin: 2em auto;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🎉 Mamunki’s 45 Quest 🎉</h1>
  <p>Enter the code you found to unlock your next surprise:</p>

  <input id="codeInput" type="text" placeholder="Enter code (e.g. bday01)" />
  <br />
  <button onclick="checkCode()">Unlock</button>

  <div id="result"></div>
  <div id="finalMessage"></div>
<script src="codes_FULL_REAL_ALL.js"></script>
<script>
  const finalSecretMessage = "Well done, Sherlock. Now shut up and kiss me.";
  const revealedLetters = Array(finalSecretMessage.length).fill('_');
  const usedCodes = new Set();

  function checkCode() {
    const input = document.getElementById('codeInput');
    const code = input.value.trim().toLowerCase();
    const resultDiv = document.getElementById('result');
    const finalDiv = document.getElementById('finalMessage');

    if (codes[code] && !usedCodes.has(code)) {
      usedCodes.add(code);
      const data = codes[code];

      // Reveal corresponding letter
      const index = Object.keys(codes).indexOf(code);
      if (index < finalSecretMessage.length) {
        revealedLetters[index] = finalSecretMessage[index];
      }

      // Display wish + optional hint and attachment
      let html = `<p><strong></strong> ${data.text}</p>`;
      if (data.attachment) {
        html += `<p><strong></strong> <a href="${data.attachment}" target="_blank">${data.attachment}</a></p>`;
      }
      if (data.hint) {
        html += `<p><strong>Hint:</strong> ${data.hint}</p>`;
      }

      resultDiv.innerHTML = html;
      input.value = '';
      updateFinalMessage();

    } else if (usedCodes.has(code)) {
      resultDiv.innerHTML = `<p style="color:orange;">⚠️ You already used that code!</p>`;
    } else {
      resultDiv.innerHTML = `<p style="color:red;">❌ Invalid code. Try again, Mamunki!</p>`;
    }
  }

  function updateFinalMessage() {
    const msg = revealedLetters.join('');
    const finalDiv = document.getElementById('finalMessage');
    finalDiv.innerText = msg;

    if (!msg.includes('_')) {
      finalDiv.innerHTML = `🎉 ${finalSecretMessage} 🎉`;
      showConfetti();
    }
  }

  function showConfetti() {
    const confetti = document.createElement('div');
    confetti.style.position = 'fixed';
    confetti.style.top = '0';
    confetti.style.left = '0';
    confetti.style.width = '100vw';
    confetti.style.height = '100vh';
    confetti.style.pointerEvents = 'none';
    confetti.style.zIndex = '9999';
    confetti.style.fontSize = '2rem';
    confetti.innerHTML = '🎊'.repeat(200);
    document.body.appendChild(confetti);
  }
</script>



</body>
</html>
