<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The 45 Quest – Mamunki Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
  <style>
    body {
           font-family: "Baloo 2", sans-serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
    color: #3f694f;
    text-align: center;
    padding: 2em;
    background-image: URL("images/pattern.png");
      
    }
    h1 {
          font-size: 2.5em;
    margin-bottom: 0.2em;
    color: #3f694f;
    margin: 0;
    }
    h3{
      font-size: large;
    margin: 15px 0;
    }
    input {
      font-size: 1.2em;
      padding: 0.6em;
      border: 2px solid #3f694f;
      border-radius: 10px;
      width: 250px;
      margin-bottom: 1em;
      background: none;
    }
    button {
      font-size: 1.2em;
      padding: 0.6em 1em;
      background-color: #3f694f;
      color: #e6d1b5;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #finalMessage {
      font-size: 1.8em;
      letter-spacing: 0.1em;
      word-wrap: break-word;
      max-width: 600px;
      margin: 2em auto;
      font-weight: bold;
    }
    .content{
      padding: 20px;
    border-radius: 15px;
    background: #e6d1b5;
    }
    .result{
      background: rgba(63, 105, 79, 0.2);
    padding: 10px;
    border-radius: 14px;
      margin-top: 20px;
    }
    img{
      width:100%;
    }
  </style>
</head>
<body>
<div class="content">
  <h1>Mamunki’s 45 Quest</h1>
  <h3>Enter a code to unlock a memory:</h3>

  <input id="codeInput" type="text" placeholder="Enter code" />
  <br />
  <button onclick="checkCode()">Reveal</button>

  <div id="result"></div>
  <div id="finalMessage"></div>
</div>
<script src="codes_FULL_REAL_ALL.js"></script>
<script>
  const finalSecretMessage = "Well done, Sherlock. Now shut up and kiss me.";
  const revealedLetters = Array(finalSecretMessage.length).fill('_');
  const usedCodes = new Set();

  function checkCode() {
    const input = document.getElementById('codeInput');
    const code = input.value.trim().toLowerCase();
    const resultDiv = document.getElementById('result');
    const finalDiv = document.getElementById('finalMessage');

    if (codes[code] && !usedCodes.has(code)) {
      usedCodes.add(code);
      const data = codes[code];

      // Reveal corresponding letter
      const index = Object.keys(codes).indexOf(code);
      if (index < finalSecretMessage.length) {
        revealedLetters[index] = finalSecretMessage[index];
      }

      // Display wish + optional hint and attachment
      let html = `<div class="result"><p><strong></strong> ${data.text}</p>`;
      if (data.image) {
        html += `<p><img src=${data.image}></p>`;
      }
      if (data.attachment) {
        html += `<p><strong></strong> <a href="${data.attachment}" target="_blank">${data.attachment}</a></p>`;
      }
      if (data.hint) {
        html += `<p><strong>Hint:</strong> ${data.hint}</p>`;
      }
      html += `</div>`;
      resultDiv.innerHTML = html;
      input.value = '';
      updateFinalMessage();

    } else if (usedCodes.has(code)) {
      resultDiv.innerHTML = `<p style="color:orange;">You already used that code!</p>`;
    } else {
      resultDiv.innerHTML = `<p style="color:red;">Invalid code. Try again, Mamunki!</p>`;
    }
  }

  function updateFinalMessage() {
    const msg = revealedLetters.join('');
    const finalDiv = document.getElementById('finalMessage');
    finalDiv.innerText = msg;

    if (!msg.includes('_')) {
      finalDiv.innerHTML = `🎉 ${finalSecretMessage} 🎉`;
      showConfetti();
    }
  }

  function showConfetti() {
    const confetti = document.createElement('div');
    confetti.style.position = 'fixed';
    confetti.style.top = '0';
    confetti.style.left = '0';
    confetti.style.width = '100vw';
    confetti.style.height = '100vh';
    confetti.style.pointerEvents = 'none';
    confetti.style.zIndex = '9999';
    confetti.style.fontSize = '2rem';
    //confetti.innerHTML = '🎊'.repeat(200);
    document.body.appendChild(confetti);
  }
</script>



</body>
</html>
